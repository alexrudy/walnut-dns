[workspace]
resolver = "2"
members = [
    "net",
    "proto"
]

[workspace.package]
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.87"
description = "Additions and helpers for flexible hickory-dns servers"
repository = "https://github.com/alexrudy/walnut-dns"
documentation = "https://docs.rs/walnut-dns"
readme = "README.md"
authors = ["Alex Rudy <opensource@alexrudy.net>"]
categories = ["network-programming", "web-programming"]
keywords = ["dns", "server", "async"]

[workspace.dependencies]
arc-swap = "1"
async-trait = "0.1"
aws-lc-rs = { version = "1.12.3", default-features = false, features = ["prebuilt-nasm"] }
bb8 = "0.8"
bitflags = "2.4.1"
bytes = "1"
camino = "1"
chateau = "0.4"
chrono = "0.4"
clap = "4"
data-encoding = { version = "2.11.1", default-features = false }
future-eyeballs = "0.1"
futures = "0.3"
hickory-proto = { version = "0.25", features = ["mdns", "dnssec-ring", "text-parsing"] }
http = { version = "1",  }
http-body = { version = "1",  }
http-body-util = { version = "0.1",  }
hyper = "1"
hyperdriver = "0.12.5"
monarch-db = { version = ">=0.1.1" }
once_cell = "1.21.4"
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
pin-project = "1.1.13"
rand = "0.9.5"
ring = "0.17"
rusqlite = { version = "0.37", features = ["blob", "chrono", "uuid", "trace"] }
rustls = { version = "0.23.23", default-features = false, features = ["logging", "std", "tls12"] }
rustls-pki-types = "1.15"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7.19", features = ["codec", "net"] }
toml_edit = { version = "0.23.10", features = ["serde"] }
tower = { version = "0.5", features = ["util"]}
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter", "json", "fmt", "ansi", "std"] }
uuid = "^1"
webpki-roots = "1"
zeroize = "1"

[patch.crates-io]
# chateau = { path = "/home/alexrudy/dev/github.com/alexrudy/chateau" }
# hyperdriver = { path = "/home/alexrudy/dev/github.com/alexrudy/hyperdriver" }
